name: Docker release (linux/amd64)

# Fork-only workflow (birdrock00/Xolotl): compile the Xolotl CUDA engines into a linux/amd64 image, push it to ghcr.io
# and publish a dated GitHub Release. The upstream .github/workflows/docker-images.yml is untouched; it packages the
# Strata Terminal from signed engine packages, which a fork cannot sign.
#
# Runs on every push to main that touches the engines or the serving layer, and by hand (Actions -> this workflow ->
# Run workflow). Tags produced, all for linux/amd64:
#
#   ghcr.io/<owner>/xolotl:latest                moves with every successful build
#   ghcr.io/<owner>/xolotl:latest-cuda           the same image, named by backend
#   ghcr.io/<owner>/xolotl:2026-11-21            the date of the release (moves within that day)
#   ghcr.io/<owner>/xolotl:2026-11-21-1a2b3c4    the same build, immutable (date + commit)
#   ghcr.io/<owner>/xolotl:0.1.54                the engine version in CMakeLists.txt
#
# and a GitHub Release named "Docker 2026-11-21 (amd64)" (tag docker-2026-11-21-1a2b3c4) whose body carries the tags,
# the image digest and the run command.

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA architectures to compile for (semicolon separated: 86 = RTX 30, 89 = RTX 40, 120 = RTX 50)'
        required: false
        default: '89'
        type: string
      push:
        description: 'Push the image to ghcr.io (off: build only, nothing published, no release)'
        required: true
        default: true
        type: boolean
      release:
        description: 'Publish the dated GitHub Release (off: image only)'
        required: true
        default: true
        type: boolean
      build_targets:
        description: 'CMake targets to compile'
        required: false
        default: 'xolotl-inkling xolotl-inkling-dspark xolotl-dense'
        type: string
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.xolotl-cuda'
      - 'docker/inkling-entrypoint.sh'
      - '.github/workflows/docker-release.yml'
      - 'CMakeLists.txt'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'src/**'
      - 'include/**'
      - 'kernel/**'
      - 'serve/**'
      - 'tools/xolotl/**'
      - 'tools/inkling/**'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/xolotl
  BUILDKIT_PROGRESS: plain

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      digest: ${{ steps.meta.outputs.digest }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Work out the tags
        id: plan
        run: |
          set -eu
          date_tag=$(date -u +%Y-%m-%d)
          sha_tag=$(git rev-parse --short=7 HEAD)
          version=$(sed -n 's/^[[:space:]]*project([^)]*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          version=${version:-dev}
          arch=${{ inputs.cuda_arch || '89' }}
          arch_slug=$(echo "$arch" | tr ';,' '-' | tr '[:upper:]' '[:lower:]')
          {
            echo "$IMAGE:latest"
            echo "$IMAGE:latest-cuda"
            echo "$IMAGE:$date_tag"
            echo "$IMAGE:$date_tag-$sha_tag"
            echo "$IMAGE:$version-cuda$arch_slug"
          } > tags.txt
          {
            echo "tags<<TAGSEND"
            cat tags.txt
            echo TAGSEND
          } >> "$GITHUB_OUTPUT"
          push_want=${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          release_want=${{ github.event_name != 'workflow_dispatch' || inputs.release }}
          echo "push=$push_want" >> "$GITHUB_OUTPUT"
          echo "release=$release_want" >> "$GITHUB_OUTPUT"
          echo "date=$date_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat tags.txt

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) linux/amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.xolotl-cuda
          platforms: linux/amd64
          push: ${{ steps.plan.outputs.push == 'true' }}
          load: false
          provenance: false
          sbom: false
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            CUDA_ARCHITECTURES=${{ inputs.cuda_arch || '89' }}
            BUILD_TARGETS=${{ inputs.build_targets || 'xolotl-inkling xolotl-inkling-dspark xolotl-dense' }}
            IMAGE_VERSION=${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.sha }}
          cache-from: type=gha,scope=xolotl-cuda-${{ inputs.cuda_arch || '89' }}
          cache-to: type=gha,scope=xolotl-cuda-${{ inputs.cuda_arch || '89' }},mode=max,max-duration=25m

      - name: Record the digest
        id: meta
        run: |
          set -eu
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.sha }}" \
                     --format '{{json .}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["manifest"]["digest"])')
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image: $IMAGE@${digest}"

      - name: Smoke test the pushed image
        if: steps.plan.outputs.push == 'true'
        run: |
          set -eu
          ref="$IMAGE:${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.sha }}"
          docker pull --platform linux/amd64 "$ref"
          docker run --rm --entrypoint /bin/sh "$ref" -c '
            set -e
            echo "engines:"; ls -l /opt/xolotl/bin
            echo "missing shared objects (libcublas is on purpose: the GPU driver and the CUDA runtime image supply it):"
            ldd /opt/xolotl/bin/xolotl-inkling | grep "not found" || echo "  none"
            /opt/xolotl/venv/bin/python3 -c "import serve.server, sys; print(\"serve.server imports on\", sys.version.split()[0])"
            echo "engine help (first lines):"; /opt/xolotl/bin/xolotl-inkling --help | head -5 || true
          '

      - name: Write the release notes
        if: steps.plan.outputs.push == 'true' && steps.plan.outputs.release == 'true' 
        run: |
          set -eu
          cat > notes.md <<EOF
          ## Xolotl container, linux/amd64, CUDA

          Built ${{ steps.plan.outputs.date }} from [\`${{ steps.plan.outputs.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          Engine sources: Strata/Xolotl \`${{ steps.plan.outputs.version }}\`. Compiled for CUDA arch \`${{ inputs.cuda_arch || '89' }}\`
          (89 = RTX 40 / 4090, 86 = RTX 30, 120 = RTX 50) with \`docker/Dockerfile.xolotl-cuda\`.

          **Image tags**

          - \`$IMAGE:latest\`
          - \`$IMAGE:latest-cuda\`
          - \`$IMAGE:${{ steps.plan.outputs.date }}\`
          - \`$IMAGE:${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.sha }}\`
          - \`$IMAGE:${{ steps.plan.outputs.version }}-cuda$(echo "${{ inputs.cuda_arch || '89' }}" | tr ';,' '-' | tr '[:upper:]' '[:lower:]')\`

          Digest: \`${{ steps.meta.outputs.digest }}\`

          **Run**

          \`\`\`bash
          docker run --rm --gpus all -p 127.0.0.1:8080:8080 --shm-size 8g \\
            -v /path/to/models:/models:ro \\
            -e INKLING_GGUF=/models/Inkling-2-Mini-XQ-Uncensored.gguf \\
            -e INKLING_TOKENIZER=/models/inkling-tokenizer \\
            -e INKLING_CTX=32768 \\
            $IMAGE:latest
          \`\`\`

          OpenAI-compatible API on \`:8080/v1\` (\`inkling-2-mini\`), Anthropic-shaped \`/v1/messages\`.
          Everything the entrypoint understands: \`docker/inkling-entrypoint.sh\`.
          EOF
          cat notes.md

      - name: Publish the GitHub Release
        if: steps.plan.outputs.push == 'true' && steps.plan.outputs.release == 'true' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: docker-${{ steps.plan.outputs.date }}-${{ steps.plan.outputs.sha }}
          NAME: Docker ${{ steps.plan.outputs.date }} (amd64)
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$NAME" --latest --notes-file notes.md
          else
            gh release create "$TAG" --title "$NAME" --latest --notes-file notes.md --target "$GITHUB_SHA"
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Xolotl image"
            echo "- arch: linux/amd64, CUDA \`${{ inputs.cuda_arch || '89' }}\`"
            echo "- pushed: ${{ inputs.push != false }}"
            [ -s tags.txt ] && sed 's/^/- `/; s/$/`/' tags.txt
            [ -n "${{ steps.meta.outputs.digest }}" ] && echo "- digest: \`${{ steps.meta.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
